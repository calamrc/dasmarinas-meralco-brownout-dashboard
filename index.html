<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Salitran II Meralco v3</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></head><body class="bg-gray-950 text-white p-6 max-w-4xl mx-auto"><header class="flex justify-between mb-8"><h1 class="text-4xl font-bold">Salitran II Dashboard v3</h1><div id="status" class="px-4 py-2 bg-red-600 rounded-2xl">RED ALERT</div></header><div id="main-status" class="bg-gray-900 p-8 rounded-3xl text-center mb-8"><p id="affected" class="text-6xl font-bold text-green-400">NOT AFFECTED</p><p class="text-xl">Salitran II • Dasmariñas</p></div><button onclick="fetchData()" class="w-full bg-emerald-600 py-4 rounded-2xl">Refresh from Meralco</button><script>async function fetchData(){try{const r=await fetch('https://api.allorigins.win/raw?url=https://company.meralco.com.ph/news-and-advisories/yellow-and-red-alert-locations');const t=await r.text();document.getElementById('affected').textContent=t.includes('SALITRAN II')?'POSSIBLE OUTAGE':'NOT IN LIST';document.getElementById('affected').className=t.includes('SALITRAN II')?'text-6xl font-bold text-orange-400':'text-6xl font-bold text-green-400';}catch(e){alert('Refresh official page');}}fetchData();</script></body></html>
