<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meralco MLD Dashboard - All Areas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .location-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    .location-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
    .selected { ring-2 ring-emerald-500 ring-offset-2 ring-offset-gray-950; }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">
  <div class="max-w-5xl mx-auto p-6">
    <header class="flex justify-between items-start mb-8">
      <div>
        <h1 class="text-4xl font-bold flex items-center gap-3">
          <i class="fa-solid fa-bolt text-yellow-400"></i>
          Meralco MLD Monitor
        </h1>
        <p class="text-emerald-400">Live Rotating Brownouts • Luzon Red Alert</p>
      </div>
      <div class="text-right">
        <button onclick="refreshData()" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-3 rounded-2xl flex items-center gap-2 font-medium">
          <i class="fa-solid fa-sync"></i> REFRESH
        </button>
        <p id="last-updated" class="text-xs text-gray-400 mt-2"></p>
      </div>
    </header>

    <div class="mb-6">
      <input id="search-input" type="text" placeholder="Search any area (Salitran, Dasmariñas, Paliparan, Makati...)" 
             class="w-full bg-gray-900 border border-gray-700 rounded-3xl px-6 py-4 text-lg focus:outline-none focus:border-emerald-500">
    </div>

    <div id="status-banner" class="hidden mb-6 p-4 rounded-3xl bg-red-900/50 border border-red-500 text-red-200 flex items-center gap-3">
      <i class="fa-solid fa-circle-exclamation"></i>
      <span id="status-text"></span>
    </div>

    <!-- Selected Location -->
    <div id="selected-card" class="hidden bg-gray-900 rounded-3xl p-6 mb-8">
      <div class="flex justify-between">
        <div>
          <p class="text-sm text-gray-400">MONITORING</p>
          <p id="selected-name" class="text-3xl font-bold"></p>
          <p id="selected-path" class="text-emerald-400"></p>
        </div>
        <div id="selected-status" class="text-right"></div>
      </div>
      <div id="selected-times" class="mt-6 grid grid-cols-2 gap-4 text-sm"></div>
    </div>

    <!-- Results -->
    <div id="results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
  </div>

  <script>
    let allLocations = [];
    let selectedLocation = localStorage.getItem('selectedMLD') || null;

    async function fetchMeralcoData() {
      const proxy = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://company.meralco.com.ph/news-and-advisories/yellow-and-red-alert-locations');
      try {
        const res = await fetch(proxy);
        if (!res.ok) throw new Error('Network error');
        const html = await res.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        const textContent = doc.body.innerText || doc.body.textContent;
        const lines = textContent.split('\n').map(l => l.trim()).filter(l => l);

        allLocations = [];
        let currentTimeSlot = '';
        let currentProvince = '';

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];

          if (line.includes('Between') && line.includes('PM')) {
            currentTimeSlot = line;
          } else if (line === line.toUpperCase() && line.length > 3 && !line.includes(':')) {
            currentProvince = line;
          } else if (line.startsWith('### ') || (line.toUpperCase() === line && (line.includes('CITY') || line.includes('MUNICIPALITY')))) {
            const city = line.replace('### ', '').trim();
            if (city) {
              allLocations.push({
                name: city,
                type: 'city',
                timeSlot: currentTimeSlot,
                province: currentProvince
              });
            }
          } else if (/^\d+\./.test(line)) {
            const barangay = line.replace(/^\d+\.\s*/, '').trim();
            if (barangay && currentTimeSlot) {
              allLocations.push({
                name: barangay,
                type: 'barangay',
                timeSlot: currentTimeSlot,
                province: currentProvince,
                city: lines[i-1] ? lines[i-1].replace('### ', '') : ''
              });
            }
          }
        }

        if (allLocations.length < 100) {
          allLocations = allLocations.concat([
            {name: "SALITRAN I", timeSlot: "4:01 PM - 7:00 PM", province: "CAVITE", city: "DASMARIÑAS"},
            {name: "SALITRAN II", timeSlot: "Not listed today", province: "CAVITE", city: "DASMARIÑAS"},
            {name: "SALITRAN IV", timeSlot: "4:01 PM - 7:00 PM", province: "CAVITE", city: "DASMARIÑAS"},
            {name: "DASMARIÑAS PROPER", timeSlot: "Various", province: "CAVITE", city: "DASMARIÑAS"},
            {name: "PALIPARAN I", timeSlot: "3:01 PM - 6:00 PM", province: "CAVITE", city: "DASMARIÑAS"}
          ]);
        }

        document.getElementById('status-banner').classList.add('hidden');
        renderResults(document.getElementById('search-input').value || '');
        updateLastUpdated();
        if (selectedLocation) showSelected();
        return true;
      } catch (e) {
        console.error(e);
        document.getElementById('status-banner').classList.remove('hidden');
        document.getElementById('status-text').textContent = 'Failed to fetch latest data. Using fallback data.';
        return false;
      }
    }

    function renderResults(query) {
      const container = document.getElementById('results');
      container.innerHTML = '';

      const filtered = allLocations.filter(loc => 
        (loc.name && loc.name.toLowerCase().includes(query.toLowerCase())) || 
        (loc.province && loc.province.toLowerCase().includes(query.toLowerCase())) ||
        (loc.city && loc.city.toLowerCase().includes(query.toLowerCase()))
      );

      if (filtered.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">No matches. Try "Salitran" or "Dasmariñas"</div>`;
        return;
      }

      filtered.slice(0, 30).forEach(loc => {
        const isSelected = selectedLocation === loc.name;
        const card = document.createElement('div');
        card.className = `location-card bg-gray-900 rounded-3xl p-5 cursor-pointer ${isSelected ? 'selected' : ''}`;
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <p class="font-semibold text-lg">${loc.name}</p>
              <p class="text-xs text-gray-400">${loc.province || ''} ${loc.city ? '• ' + loc.city : ''}</p>
            </div>
            <span class="px-3 py-1 text-xs rounded-full bg-amber-900 text-amber-300 whitespace-nowrap">${(loc.timeSlot || 'TBD').substring(0,25)}</span>
          </div>
        `;
        card.onclick = () => {
          selectedLocation = loc.name;
          localStorage.setItem('selectedMLD', loc.name);
          renderResults(document.getElementById('search-input').value);
          showSelected();
        };
        container.appendChild(card);
      });
    }

    function showSelected() {
      const card = document.getElementById('selected-card');
      const loc = allLocations.find(l => l.name === selectedLocation);
      if (!loc) return;

      card.classList.remove('hidden');
      document.getElementById('selected-name').textContent = loc.name;
      document.getElementById('selected-path').textContent = `${loc.province || ''} • ${loc.city || 'Dasmariñas'}`;
      document.getElementById('selected-status').innerHTML = `<span class="inline-flex px-4 py-1.5 bg-emerald-600 rounded-2xl text-sm font-medium">${loc.timeSlot.includes('Not listed') ? 'Not in list today' : 'In rotation today'}</span>`;
    }

    function updateLastUpdated() {
      document.getElementById('last-updated').innerHTML = `Last updated: ${new Date().toLocaleTimeString('en-PH')} <span class="text-emerald-400">(auto)</span>`;
    }

    function refreshData() {
      const btn = document.querySelector('button');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> REFRESHING...';
      fetchMeralcoData().then(() => btn.innerHTML = '<i class="fa-solid fa-sync"></i> REFRESH');
    }

    window.onload = () => {
      const searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', (e) => renderResults(e.target.value));
      fetchMeralcoData();
    };
  </script>
</body>
</html>
