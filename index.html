<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meralco MLD Dashboard - All Areas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: system-ui, sans-serif; }
    .location-card { transition: all 0.2s; }
    .location-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3); }
    .selected { ring-4 ring-emerald-500; }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">
  <div class="max-w-6xl mx-auto p-6">
    <header class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-4xl font-bold flex items-center gap-3">
          <i class="fa-solid fa-bolt text-yellow-400"></i>
          Meralco Rotating Brownouts
        </h1>
        <p class="text-emerald-400">Live from Official Page • Updated on Refresh</p>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="refreshData()" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-3 rounded-2xl flex items-center gap-2 font-medium">
          <i class="fa-solid fa-sync"></i> REFRESH
        </button>
        <a href="https://company.meralco.com.ph/news-and-advisories/yellow-and-red-alert-locations" target="_blank" class="text-sm text-gray-400 hover:text-white">Official Meralco →</a>
      </div>
    </header>

    <div class="mb-6">
      <input id="search" type="text" placeholder="Search any location (Salitran, Dasmariñas, Paliparan, Angat...)" 
             class="w-full bg-gray-900 border border-gray-700 rounded-3xl px-6 py-4 text-lg focus:outline-none focus:border-emerald-500">
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="results"></div>

    <div id="selected-area" class="mt-12 hidden bg-gray-900 rounded-3xl p-8">
      <h2 class="text-2xl font-bold mb-4">Your Monitored Location</h2>
      <div id="selected-content"></div>
    </div>
  </div>

  <script>
    let allLocations = [];

    async function fetchMeralcoData() {
      try {
        const proxy = 'https://api.allorigins.win/raw?url=';
        const url = encodeURIComponent('https://company.meralco.com.ph/news-and-advisories/yellow-and-red-alert-locations');
        const res = await fetch(proxy + url);
        const html = await res.text();

        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        // Extract text content and parse
        const textContent = doc.body.innerText || doc.body.textContent;
        const lines = textContent.split('\n').map(l => l.trim()).filter(l => l);

        allLocations = [];
        let currentTimeSlot = '';
        let currentProvince = '';

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];

          // Time slot
          if (line.includes('Between') && (line.includes('PM') || line.includes('AM'))) {
            currentTimeSlot = line;
            continue;
          }

          // Province
          if (line === line.toUpperCase() && line.length > 3 && !line.includes(':')) {
            currentProvince = line;
            continue;
          }

          // City / Barangay
          if (line.match(/^\d+\./) || line.match(/^[A-Z]/)) {
            const location = {
              name: line.replace(/^\d+\.\s*/, ''),
              timeSlot: currentTimeSlot,
              province: currentProvince,
              fullPath: `${currentProvince} - ${line}`
            };
            allLocations.push(location);
          }
        }

        // Remove duplicates
        allLocations = [...new Map(allLocations.map(item => [item.name + item.timeSlot, item])).values()];

        renderResults('');
        document.getElementById('last-updated').innerHTML = `Last updated: ${new Date().toLocaleTimeString('en-PH')}`;
      } catch (e) {
        console.error(e);
        alert('Failed to fetch latest data. Try again.');
      }
    }

    function renderResults(query) {
      const container = document.getElementById('results');
      container.innerHTML = '';

      const filtered = allLocations.filter(loc => 
        loc.name.toLowerCase().includes(query.toLowerCase()) || 
        (loc.province && loc.province.toLowerCase().includes(query.toLowerCase()))
      );

      if (filtered.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">No matching locations. Try another search.</div>`;
        return;
      }

      filtered.forEach(loc => {
        const card = document.createElement('div');
        card.className = `location-card bg-gray-900 border border-gray-700 rounded-3xl p-6 cursor-pointer`;
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <div class="font-semibold text-lg">${loc.name}</div>
              <div class="text-emerald-400 text-sm">${loc.province || 'Meralco Area'}</div>
            </div>
            <div class="text-xs bg-gray-800 px-3 py-1 rounded-full">${loc.timeSlot || 'Check time'}</div>
          </div>
        `;
        card.onclick = () => selectLocation(loc);
        container.appendChild(card);
      });
    }

    function selectLocation(loc) {
      localStorage.setItem('selectedLocation', JSON.stringify(loc));
      const panel = document.getElementById('selected-area');
      panel.classList.remove('hidden');
      document.getElementById('selected-content').innerHTML = `
        <div class="text-3xl font-bold text-emerald-400">${loc.name}</div>
        <div class="text-gray-400">${loc.province}</div>
        <div class="mt-6 p-4 bg-gray-800 rounded-2xl">
          <div class="text-sm text-gray-400">Rotation Time</div>
          <div class="text-2xl font-mono">${loc.timeSlot}</div>
        </div>
        <button onclick="refreshData()" class="mt-6 w-full bg-white text-black py-4 rounded-2xl font-medium">Refresh Schedule</button>
      `;
      alert(`Selected: ${loc.name} - ${loc.timeSlot}`);
    }

    function refreshData() {
      fetchMeralcoData();
    }

    // Init
    window.onload = () => {
      fetchMeralcoData();

      // Restore previous selection
      const saved = localStorage.getItem('selectedLocation');
      if (saved) {
        selectLocation(JSON.parse(saved));
      }

      // Live search
      const searchInput = document.getElementById('search');
      searchInput.addEventListener('input', (e) => renderResults(e.target.value));
    };
  </script>
</body>
</html>
